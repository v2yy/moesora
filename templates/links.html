<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{modules/layout :: layout(content=~{::content}, hero=~{}, isHome=false)}">
<body>
<th:block th:fragment="content">
  <div class="moe-page-head moe-card moe-fancy-head">
    <div class="moe-halo"><b class="moe-halo-num">0</b><small>位朋友</small></div>
    <div class="moe-fancy-head-text">
      <h1 class="moe-page-title"><span class="moe-page-title-icon"><th:block th:replace="~{modules/icons :: icon('link')}"></th:block></span><span>友情链接</span></h1>
      <p class="moe-links-sub" id="moe-links-hitokoto"
         th:if="${#strings.isEmpty(theme.config.sidebar?.links_sub_text)}"
         th:text="'与这些有趣的灵魂相遇 ♪(´▽｀)'">与这些有趣的灵魂相遇 ♪(´▽｀)</p>
      <p class="moe-links-sub" id="moe-links-hitokoto-custom"
         th:if="${!#strings.isEmpty(theme.config.sidebar?.links_sub_text)}"
         th:text="${theme.config.sidebar.links_sub_text}">自定义副标题</p>
    </div>
  </div>

  <th:block th:each="group,gStat : ${groups}">
    <div class="moe-card moe-link-group" th:classappend="${'moe-accent-' + (gStat.index % 5)}">
      <div class="moe-link-group-head">
        <h3 class="moe-card-title" th:text="${group.spec.displayName}">分组</h3>
        <span class="moe-link-count" th:text="${#lists.size(group.links)}">0</span>
      </div>
      <div class="moe-link-list">
        <a th:each="link,lStat : ${group.links}" class="moe-link-item"
           th:style="|animation-delay:${lStat.index * 60}ms|"
           th:href="${link.spec.url}" target="_blank" rel="noopener"
           th:title="${link.spec.description}">
          <span class="moe-link-logo-wrap">
            <img class="moe-link-logo"
                 th:if="${!#strings.isEmpty(link.spec.logo)}"
                 th:src="${link.spec.logo}" th:alt="${link.spec.displayName}" loading="lazy"/>
            <span th:if="${#strings.isEmpty(link.spec.logo)}"
                  th:classappend="${'moe-avatar-c' + (lStat.index % 6)}"
                  class="moe-link-logo moe-link-logo-fallback"
                  th:text="${#strings.isEmpty(link.spec.displayName) ? '?' : #strings.toUpperCase(#strings.substring(link.spec.displayName,0,1))}">A</span>
          </span>
          <span class="moe-link-meta">
            <span class="moe-link-name" th:text="${link.spec.displayName}">站点</span>
            <span class="moe-link-desc" th:text="${link.spec.description}">描述</span>
          </span>
        </a>
      </div>
    </div>
  </th:block>

  <div th:if="${groups == null or #lists.isEmpty(groups)}" class="moe-card moe-empty">
    还没有友链 (｡･ω･｡)
  </div>

  <div th:if="${param.applied == 'success'}" class="moe-card moe-link-apply-tip is-success" role="status">
    申请已提交，等待站长审核，请耐心等待～ (๑•̀ㅂ•́)و✧
  </div>
  <div th:if="${param.applied == 'error' or param.applied == 'disabled'}" class="moe-card moe-link-apply-tip is-error" role="alert"
       th:text="${param.message ?: '提交失败，请稍后再试'}">提交失败</div>

  <!-- 友链自助申请：由「链接管理」插件提供 linkApplicationEnabled / csrfToken 等模板变量 -->
  <div th:if="${linkApplicationEnabled}" class="moe-card moe-link-apply-form">
    <h3 class="moe-card-title"><span class="moe-title-ico"><th:block th:replace="~{modules/icons :: icon('heart')}"></th:block></span>申请友链</h3>
    <p class="moe-link-apply-hint">填写下面的信息提交申请，审核通过后会出现在上方列表里~</p>
    <form id="moe-link-apply-form" method="post" th:action="@{/links/apply/submit}" class="moe-link-apply-grid">
      <input type="hidden" name="_csrf" th:value="${csrfToken}"/>
      <label class="moe-field">
        <span class="moe-field-label">网站地址 *</span>
        <input class="moe-field-input" name="url" type="url" required placeholder="https://example.com"
               th:value="${param.field == 'url' ? param.value : ''}"/>
      </label>
      <label class="moe-field">
        <span class="moe-field-label">网站名称 *</span>
        <input class="moe-field-input" name="displayName" required placeholder="站点名称"
               th:value="${param.field == 'displayName' ? param.value : ''}"/>
      </label>
      <label class="moe-field">
        <span class="moe-field-label">Logo 地址</span>
        <input class="moe-field-input" name="logo" type="url" placeholder="https://example.com/logo.png（可留空）"
               th:value="${param.field == 'logo' ? param.value : ''}"/>
      </label>
      <label class="moe-field">
        <span class="moe-field-label">联系邮箱</span>
        <input class="moe-field-input" name="email" type="email" placeholder="可留空"
               th:value="${param.field == 'email' ? param.value : ''}"/>
      </label>
      <label class="moe-field moe-field-wide">
        <span class="moe-field-label">网站描述</span>
        <textarea class="moe-field-input" name="description" rows="2" placeholder="一句话介绍一下你的站点（可留空）"
                  th:text="${param.field == 'description' ? param.value : ''}"></textarea>
      </label>
      <label class="moe-field">
        <span class="moe-field-label">反链地址</span>
        <input class="moe-field-input" name="backlink" type="url" placeholder="你添加本站友链的页面地址（可留空）"
               th:value="${param.field == 'backlink' ? param.value : ''}"/>
      </label>
      <label class="moe-field">
        <span class="moe-field-label">RSS/Atom 订阅</span>
        <textarea class="moe-field-input" name="feedUrls" rows="2" placeholder="一行一个，可留空"
                  th:text="${param.field == 'feedUrls' ? param.value : ''}"></textarea>
      </label>
      <div class="moe-field moe-field-captcha">
        <span class="moe-field-label">验证码 *</span>
        <div class="moe-link-apply-captcha-row">
          <img id="moe-link-apply-captcha" src="/links/apply/captcha" alt="验证码" width="120" height="42"/>
          <button type="button" class="moe-link-apply-captcha-refresh" title="换一张">⟳</button>
          <input class="moe-field-input" name="captchaCode" required minlength="5" maxlength="5"
                 autocomplete="off" placeholder="图中字符"/>
        </div>
      </div>
      <button type="submit" class="moe-link-apply-submit">提交申请</button>
    </form>
  </div>

  <div th:unless="${linkApplicationEnabled}" class="moe-card moe-links-apply">
    <h3 class="moe-card-title"><span class="moe-title-ico"><th:block th:replace="~{modules/icons :: icon('heart')}"></th:block></span>想和我交换友链?</h3>
    <p>在留言墙或任意文章评论区留下你的<b> 站点名称 / 链接 / 头像 / 一句话描述 </b>，我看到后会尽快添加~ (๑•̀ㅂ•́)و✧</p>
  </div>

  <script th:if="${linkApplicationEnabled}">
  (function(){
    var img = document.getElementById('moe-link-apply-captcha');
    var btn = document.querySelector('.moe-link-apply-captcha-refresh');
    if(btn && img){
      btn.addEventListener('click', function(){
        img.src = '/links/apply/captcha?_=' + Date.now();
      });
    }
  })();
  </script>

  <script>
  (function(){
    // 未填写自定义副标题时，从内置文案中随机挑一句展示
    var customSub = document.getElementById('moe-links-hitokoto-custom');
    var hitokotoEl = document.getElementById('moe-links-hitokoto');
    if (!customSub && hitokotoEl) {
      var lines=["与这些有趣的灵魂相遇 ♪(´▽｀)","点击头像，去看看 TA 们的小世界~","这里是我珍藏的宝藏站点 (〇′ﾂ〇′)も","愿你也能找到同频的朋友 ✿","缘分让我们在此相遇 (｡･ω･｡)ﾉ♡","友谊的小船，永不翻船 ⚓","山水一程，皆是朋友 ✿","遇见即是缘，感谢你来过 (´▽｀)ノ","这些是我在互联网上的好邻居~","点开一个，发现一个新世界 ✨","志同道合，不期而遇 ♪","愿我们都被世界温柔以待 (｡◕‿◕｡)","互相点亮，彼此照耀 ⋆｡°✩","一起在赛博世界里冒险吧 🚀","常来串门呀，门一直开着~","友链虽小，情谊满满 (◍•ᴗ•◍)"];
      hitokotoEl.textContent=lines[Math.floor(Math.random()*lines.length)];
    }
    var n=document.querySelector('.moe-halo-num'); if(n){n.textContent=document.querySelectorAll('.moe-link-item').length;}
  })();
  </script>
</th:block>
</body>
</html>
